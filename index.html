<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iemes32 bio</title>
    <link rel="icon" id="favicon" href="" type="image/png" />
    <style>
        /* ===== ЗАГРУЗЧИК ===== */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, #002b44, #0e1419 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.8s ease; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .loader-title { font-size: 28px; font-weight: 300; color: #e0f0fa; letter-spacing: 4px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(43, 161, 203, 0.3); }
        .progress-container { width: 280px; max-width: 80%; background: rgba(255, 255, 255, 0.08); border-radius: 40px; height: 8px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2ba1cb, #5c6873); border-radius: 40px; transition: width 0.3s ease; box-shadow: 0 0 20px rgba(43, 161, 203, 0.4); }
        .progress-text { margin-top: 14px; font-size: 16px; color: #9bb7c9; letter-spacing: 2px; font-weight: 300; }
        .loader-enter-btn { margin-top: 35px; padding: 12px 48px; background: rgba(43, 161, 203, 0.2); border: 1px solid #2ba1cb; border-radius: 60px; color: #fff; font-size: 18px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; letter-spacing: 2px; opacity: 0; transform: translateY(20px); pointer-events: none; box-shadow: 0 0 30px rgba(43, 161, 203, 0.1); }
        .loader-enter-btn.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .loader-enter-btn:hover { background: rgba(43, 161, 203, 0.4); box-shadow: 0 0 50px rgba(43, 161, 203, 0.3); transform: scale(1.05); }
        .loader-skip-btn { margin-top: 20px; padding: 8px 30px; background: rgba(255, 107, 107, 0.2); border: 1px solid #ff6b6b; border-radius: 60px; color: #ff6b6b; font-size: 14px; cursor: pointer; transition: all 0.3s ease; opacity: 0; pointer-events: none; display: none; }
        .loader-skip-btn.active { opacity: 1; pointer-events: auto; display: inline-block; }
        .loader-skip-btn:hover { background: rgba(255, 107, 107, 0.3); }

        /* ===== ОБЩИЕ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at 30% 30%, #002b44, #0e1419 80%); color: #fff; padding: 20px; position: relative; overflow-x: hidden; animation: bgPulse 8s ease-in-out infinite alternate; }
        @keyframes bgPulse { 0% { background: radial-gradient(circle at 20% 20%, #002b44, #0e1419 80%); } 100% { background: radial-gradient(circle at 80% 80%, #003b5c, #0a1a22 80%); } }
        body.lightbox-open { overflow: hidden; }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; background: rgba(43, 161, 203, 0.6); border-radius: 50%; box-shadow: 0 0 15px #2ba1cb; animation: floatParticle linear infinite; transition: transform 0.1s, opacity 0.1s; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .neon-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; opacity: 0.3; }
        .neon-line { position: absolute; background: linear-gradient(90deg, transparent, #2ba1cb, transparent); height: 2px; width: 100%; animation: slideLine 6s linear infinite; box-shadow: 0 0 15px #2ba1cb; }
        .neon-line:nth-child(2) { top: 30%; animation-duration: 8s; animation-delay: -2s; height: 1px; background: linear-gradient(90deg, transparent, #5c6873, transparent); }
        .neon-line:nth-child(3) { top: 70%; animation-duration: 10s; animation-delay: -4s; }
        @keyframes slideLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        #visualizer { position: fixed; bottom: 0; left: 0; width: 100%; height: 120px; pointer-events: none; z-index: 0; opacity: 0.4; }

        .card { position: relative; z-index: 1; background: rgba(14, 25, 29, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(43, 161, 203, 0.3); border-radius: 32px; padding: 40px 35px; max-width: 700px; width: 100%; box-shadow: 0 20px 60px rgba(0, 43, 68, 0.8), 0 0 40px rgba(43, 161, 203, 0.2); transition: transform 0.3s ease, box-shadow 0.3s ease; animation: glowPulse 4s ease-in-out infinite alternate; }
        @keyframes glowPulse { 0% { box-shadow: 0 20px 60px rgba(0, 43, 68, 0.8), 0 0 40px rgba(43, 161, 203, 0.2); } 100% { box-shadow: 0 30px 80px rgba(0, 43, 68, 0.9), 0 0 70px rgba(43, 161, 203, 0.4); } }
        .card:hover { transform: translateY(-5px); box-shadow: 0 30px 80px rgba(0, 43, 68, 0.9), 0 0 60px rgba(43, 161, 203, 0.3); }

        .lang-toggle { position: absolute; top: 18px; right: 18px; background: rgba(43, 161, 203, 0.1); border: 1px solid rgba(43, 161, 203, 0.3); color: #9bb7c9; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 1px; transition: all 0.3s; z-index: 5; font-family: inherit; }
        .lang-toggle:hover { background: rgba(43, 161, 203, 0.25); color: #fff; border-color: #2ba1cb; box-shadow: 0 0 15px rgba(43, 161, 203, 0.3); }

        .avatar { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; margin: 0 auto 20px; display: block; border: 3px solid #2ba1cb; box-shadow: 0 0 30px rgba(43, 161, 203, 0.5), inset 0 0 20px rgba(43, 161, 203, 0.2); transition: box-shadow 0.3s ease, transform 0.3s ease; animation: pulseBorder 3s ease-in-out infinite; }
        .avatar:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(43, 161, 203, 0.8), inset 0 0 30px rgba(43, 161, 203, 0.4); }
        @keyframes pulseBorder { 0%, 100% { box-shadow: 0 0 20px rgba(43, 161, 203, 0.4), inset 0 0 10px rgba(43, 161, 203, 0.1); } 50% { box-shadow: 0 0 50px rgba(43, 161, 203, 0.8), inset 0 0 30px rgba(43, 161, 203, 0.3); } }

        .name { font-size: 28px; font-weight: 700; margin-bottom: 4px; background: linear-gradient(135deg, #ffffff, #2ba1cb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 0.5px; }
        .title { font-size: 16px; color: #9bb7c9; margin-bottom: 20px; letter-spacing: 1px; font-weight: 300; border-bottom: 1px solid rgba(43, 161, 203, 0.2); padding-bottom: 15px; }

        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 24px; background: rgba(43, 161, 203, 0.08); border: 1px solid rgba(43, 161, 203, 0.2); border-radius: 40px; color: #9bb7c9; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(4px); font-family: inherit; }
        .tab-btn:hover { background: rgba(43, 161, 203, 0.15); border-color: #2ba1cb; color: #fff; }
        .tab-btn.active { background: rgba(43, 161, 203, 0.2); border-color: #2ba1cb; color: #fff; box-shadow: 0 0 20px rgba(43, 161, 203, 0.2); }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .projects-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 10px; }
        @media (min-width: 500px) { .projects-grid { grid-template-columns: 1fr 1fr; } }
        .project-card { background: rgba(0, 43, 68, 0.3); border-radius: 20px; padding: 16px; border: 1px solid rgba(43, 161, 203, 0.15); transition: all 0.3s ease; text-align: left; }
        .project-card:hover { border-color: rgba(43, 161, 203, 0.4); box-shadow: 0 0 30px rgba(43, 161, 203, 0.1); transform: translateY(-4px); }
        .project-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(43, 161, 203, 0.1); }
        .project-card h4 { font-size: 18px; color: #fff; margin-bottom: 4px; }
        .project-card .project-desc { font-size: 14px; color: #c8dde8; margin-bottom: 8px; line-height: 1.4; }
        .project-card a { color: #2ba1cb; text-decoration: none; font-weight: 500; font-size: 14px; transition: color 0.3s; }
        .project-card a:hover { color: #3fc3f0; text-decoration: underline; }

        /* ===== АЛЬБОМ ===== */
        .album-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; flex-wrap: wrap; }
        .album-settings-toggle { padding: 6px 16px; background: rgba(43, 161, 203, 0.08); border: 1px solid rgba(43, 161, 203, 0.25); border-radius: 40px; color: #9bb7c9; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.25s ease; }
        .album-settings-toggle:hover, .album-settings-toggle.active { background: rgba(43, 161, 203, 0.2); border-color: #2ba1cb; color: #fff; box-shadow: 0 0 20px rgba(43, 161, 203, 0.2); }
        .album-count { font-size: 12px; color: #7f9aab; letter-spacing: 0.5px; }

        .album-settings-panel { display: none; background: rgba(0, 43, 68, 0.3); border: 1px solid rgba(43, 161, 203, 0.15); border-radius: 16px; padding: 10px 16px; margin-bottom: 14px; animation: fadeIn 0.3s ease; }
        .album-settings-panel.active { display: block; }
        .album-setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; color: #c8dde8; }
        .album-setting-row + .album-setting-row { border-top: 1px solid rgba(43, 161, 203, 0.08); }
        .album-setting-row select { background: rgba(14, 25, 29, 0.9); color: #e0f0fa; border: 1px solid rgba(43, 161, 203, 0.3); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer; }
        .album-setting-row select:focus { border-color: #2ba1cb; }

        .switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .switch span { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(43, 161, 203, 0.25); border-radius: 22px; cursor: pointer; transition: all 0.25s ease; }
        .switch span::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #9bb7c9; border-radius: 50%; transition: all 0.25s ease; }
        .switch input:checked + span { background: rgba(43, 161, 203, 0.55); border-color: #2ba1cb; }
        .switch input:checked + span::before { transform: translateX(20px); background: #fff; }

        .album-grid { display: flex; align-items: flex-start; gap: var(--album-gap, 12px); margin-top: 4px; }
        .album-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--album-gap, 12px); }
        .album-item { position: relative; width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid rgba(43, 161, 203, 0.2); background: rgba(0, 43, 68, 0.3); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; animation: albumItemIn 0.4s ease both; }
        @keyframes albumItemIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .album-item:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(43, 161, 203, 0.3); z-index: 2; }
        .album-item img, .album-item video { display: block; width: 100%; height: 100%; object-fit: cover; background: #0e1419; }
        .album-item img { -webkit-user-select: none; user-select: none; }
        .album-empty { text-align: center; color: #9bb7c9; padding: 40px 0; font-size: 15px; }
        .album-empty code { color: #2ba1cb; }
        .album-loader { text-align: center; padding: 18px 0; font-size: 13px; color: #7f9aab; letter-spacing: 1px; }
        .album-sentinel { width: 100%; height: 1px; }

        /* ===== ЛАЙТБОКС ===== */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; padding: 4vh 4vw; }
        .lightbox.active { display: flex; animation: lbIn 0.25s ease; }
        @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
        .lightbox-img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 0 80px rgba(43, 161, 203, 0.5), 0 20px 60px rgba(0, 0, 0, 0.8); animation: lbImgIn 0.3s ease; }
        @keyframes lbImgIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .lightbox-close { position: absolute; top: 18px; right: 24px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(43, 161, 203, 0.4); color: #fff; font-size: 34px; line-height: 1; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; z-index: 2; }
        .lightbox-close:hover { background: rgba(43, 161, 203, 0.4); transform: rotate(90deg); }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(43, 161, 203, 0.15); border: 1px solid rgba(43, 161, 203, 0.5); color: #fff; font-size: 34px; line-height: 1; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; z-index: 2; }
        .lightbox-nav:hover { background: rgba(43, 161, 203, 0.4); box-shadow: 0 0 25px rgba(43, 161, 203, 0.4); }
        .lightbox-prev { left: 18px; }
        .lightbox-next { right: 18px; }
        .lightbox-counter { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(43, 161, 203, 0.3); color: #c8dde8; font-size: 13px; padding: 6px 16px; border-radius: 20px; letter-spacing: 1px; }

        /* ===== СОЦСЕТИ / АУДИО / МОДАЛКА / БАННЕРЫ ===== */
        .socials { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 15px 0 20px; }
        .social-link { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 22px; border-radius: 60px; background: rgba(43, 161, 203, 0.08); border: 1px solid rgba(43, 161, 203, 0.25); color: #e0f0fa; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.25s ease; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); min-width: 90px; cursor: pointer; }
        .social-link:hover { background: rgba(43, 161, 203, 0.2); border-color: #2ba1cb; box-shadow: 0 0 30px rgba(43, 161, 203, 0.3); transform: translateY(-3px) scale(1.03); color: #ffffff; }
        .social-link .icon { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex-shrink: 0; }
        .social-link .icon img { width: 100%; height: 100%; object-fit: contain; }

        .audio-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0 15px; flex-wrap: wrap; }
        .audio-controls button { background: rgba(43, 161, 203, 0.15); border: 1px solid rgba(43, 161, 203, 0.3); color: #e0f0fa; border-radius: 40px; padding: 6px 16px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(4px); display: inline-flex; align-items: center; gap: 6px; }
        .audio-controls button:hover { background: rgba(43, 161, 203, 0.3); box-shadow: 0 0 20px rgba(43, 161, 203, 0.2); }
        .audio-controls input[type="range"] { -webkit-appearance: none; background: rgba(43, 161, 203, 0.2); height: 4px; border-radius: 2px; outline: none; width: 100px; transition: background 0.3s; }
        .audio-controls input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #2ba1cb; cursor: pointer; box-shadow: 0 0 10px rgba(43, 161, 203, 0.5); }
        .audio-controls input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #2ba1cb; cursor: pointer; }
        .audio-status { font-size: 13px; color: #9bb7c9; min-width: 40px; }

        .about-section { padding: 12px 10px; border-radius: 20px; background: rgba(0, 43, 68, 0.25); border: 1px solid rgba(43, 161, 203, 0.1); }
        .about-title { font-size: 18px; font-weight: 600; color: #2ba1cb; margin-bottom: 8px; letter-spacing: 1px; text-shadow: 0 0 20px rgba(43, 161, 203, 0.3); }
        .about-media { width: 100%; border-radius: 14px; margin: 8px 0 12px; max-height: 260px; object-fit: cover; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); border: 1px solid rgba(43, 161, 203, 0.15); }
        .about-text { font-size: 15px; line-height: 1.6; color: #c8dde8; text-align: left; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: rgba(14, 25, 29, 0.95); border: 1px solid #2ba1cb; border-radius: 24px; padding: 30px 25px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 60px rgba(43, 161, 203, 0.3); position: relative; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close { position: sticky; top: 0; float: right; background: none; border: none; color: #9bb7c9; font-size: 28px; cursor: pointer; transition: color 0.3s; z-index: 10; }
        .modal-close:hover { color: #fff; }
        .modal-title { font-size: 22px; font-weight: 600; color: #2ba1cb; margin-bottom: 18px; text-align: center; text-shadow: 0 0 20px rgba(43, 161, 203, 0.3); }
        .modal-body { color: #c8dde8; font-size: 14px; line-height: 1.7; text-align: left; }
        .modal-body .data-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(43, 161, 203, 0.08); }
        .modal-body .data-item .label { color: #9bb7c9; padding-right: 15px; }
        .modal-body .data-item .value { color: #fff; font-weight: 500; text-align: right; word-break: break-word; max-width: 60%; }
        .modal-body .data-item .value.highlight { color: #2ba1cb; }

        .cookie-banner { position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: rgba(14, 25, 29, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(43, 161, 203, 0.3); border-radius: 20px; padding: 18px 28px; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); animation: slideUpLeft 0.5s ease; display: none; }
        @keyframes slideUpLeft { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .cookie-banner p { font-size: 15px; color: #e0f0fa; margin-bottom: 15px; line-height: 1.4; }
        .cookie-banner .cookie-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .cookie-banner button { padding: 8px 28px; border-radius: 40px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; }
        .cookie-banner .btn-yes { background: #2ba1cb; color: #0e1419; }
        .cookie-banner .btn-yes:hover { background: #3fc3f0; transform: scale(1.05); box-shadow: 0 0 25px rgba(43, 161, 203, 0.4); }
        .cookie-banner .btn-absolutely { background: #5c6873; color: #fff; }
        .cookie-banner .btn-absolutely:hover { background: #7a8a97; transform: scale(1.05); box-shadow: 0 0 25px rgba(92, 104, 115, 0.4); }

        .vpn-banner { position: fixed; bottom: 30px; right: 30px; z-index: 1000; background: rgba(14, 25, 29, 0.92); backdrop-filter: blur(12px); border: 1px solid #ff6b6b; border-radius: 20px; padding: 18px 28px; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); animation: slideUpRight 0.5s ease; display: none; }
        @keyframes slideUpRight { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .vpn-banner p { font-size: 15px; color: #ff6b6b; margin-bottom: 15px; line-height: 1.4; }
        .vpn-banner .vpn-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .vpn-banner .btn-close-vpn { padding: 8px 28px; border-radius: 40px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; background: #ff6b6b; color: #fff; }
        .vpn-banner .btn-close-vpn:hover { background: #ff8787; transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 107, 107, 0.4); }

        @media (max-width: 600px) {
            .cookie-banner { left: 10px; right: 10px; bottom: 10px; max-width: none; width: auto; }
            .vpn-banner { left: 10px; right: 10px; bottom: 10px; max-width: none; width: auto; }
            .card { padding: 24px 18px; }
            .avatar { width: 100px; height: 100px; }
            .name { font-size: 24px; }
            .social-link { padding: 8px 14px; font-size: 13px; min-width: 70px; }
            .socials { gap: 10px; }
            .tabs { gap: 8px; }
            .tab-btn { padding: 6px 16px; font-size: 13px; }
            .audio-controls input[type="range"] { width: 70px; }
            .modal-box { padding: 20px 15px; }
            .modal-body .data-item { flex-direction: column; align-items: flex-start; gap: 2px; }
            .modal-body .data-item .value { text-align: left; max-width: 100%; }
            .projects-grid { grid-template-columns: 1fr; }
            .loader-title { font-size: 22px; }
            #visualizer { height: 60px; }
            .album-setting-row { font-size: 13px; }

    <!-- ============================================================
         ОСНОВНАЯ ЛОГИКА
         ============================================================ -->
    <script>
        (function() {
            'use strict';

            const c = CONFIG;
            let currentLang = 'ru';

            document.getElementById('favicon').href = c.avatar;

            /* ============================================================
               ОПРЕДЕЛЕНИЕ ЯЗЫКА
               CIS-языки и CIS-страны → русский.
               Если браузер CIS → русский (даже если IP не CIS — VPN).
               Если браузер не CIS, но IP CIS → русский.
               Иначе → английский.
               Ручной выбор в localStorage всегда приоритетнее.
               ============================================================ */
            const CIS_LANGS = ['ru', 'uk', 'be', 'kk', 'uz', 'ky', 'tg', 'tk', 'az', 'hy', 'ka', 'mo'];
            const CIS_COUNTRIES = ['RU', 'UA', 'BY', 'KZ', 'UZ', 'KG', 'TJ', 'TM', 'AZ', 'AM', 'MD', 'GE'];
            const LANG_STORAGE_KEY = 'iemes32_lang';

            let detectedCountry = null;

            function browserLangIsCIS() {
                const langs = navigator.languages || [navigator.language || ''];
                return langs.some(l => {
                    const code = (l || '').toLowerCase().split('-')[0];
                    return CIS_LANGS.indexOf(code) !== -1;
                });
            }

            async function fetchCountry() {
                if (detectedCountry !== null) return detectedCountry;
                try {
                    const res = await fetch('https://ipinfo.io/json?nocache=' + Date.now());
                    const data = await res.json();
                    detectedCountry = (data.country || '').toUpperCase();
                } catch (e) {
                    detectedCountry = '';
                }
                return detectedCountry;
            }

            /* ============================================================
               ПРИМЕНЕНИЕ ЯЗЫКА
               ============================================================ */
            function applyLanguage(lang) {
                if (!I18N[lang]) lang = 'ru';
                currentLang = lang;
                try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
                document.documentElement.lang = lang;
                const t = I18N[lang];

                // Loader
                document.getElementById('enterBtn').textContent = t.loader.enter;
                document.getElementById('skipBtn').textContent = t.loader.skip;

                // Tabs
                document.querySelector('.tab-btn[data-tab="about"]').textContent = t.tabs.about;
                document.querySelector('.tab-btn[data-tab="projects"]').textContent = t.tabs.projects;
                document.querySelector('.tab-btn[data-tab="album"]').textContent = t.tabs.album;

                // About
                document.getElementById('aboutTitle').textContent = t.about.title;
                document.getElementById('aboutText').innerHTML = t.about.text;

                // Projects
                renderProjects(t);

                // Album settings
                document.getElementById('albumSettingsBtn').textContent = t.album.settingsBtn;
                document.getElementById('albumSortLabel').textContent = t.album.sortLabel;
                document.getElementById('albumSortNameAsc').textContent = t.album.sortNameAsc;
                document.getElementById('albumSortNameDesc').textContent = t.album.sortNameDesc;
                document.getElementById('albumSortNone').textContent = t.album.sortNone;
                document.getElementById('albumAutoplayLabel').textContent = t.album.autoplayLabel;
                document.getElementById('albumMutedLabel').textContent = t.album.mutedLabel;
                document.getElementById('albumLoopLabel').textContent = t.album.loopLabel;
                document.getElementById('albumLoader').textContent = t.album.loading;

                if (albumEmptyState) setAlbumEmpty(albumEmptyState);
                updateAlbumCount();

                // Banners
                document.getElementById('cookieText').textContent = t.cookies.text;
                document.getElementById('cookieYes').textContent = t.cookies.yes;
                document.getElementById('cookieAbsolutely').textContent = t.cookies.absolutely;
                document.getElementById('vpnText').textContent = t.vpn.text;
                document.getElementById('vpnClose').textContent = t.vpn.close;

                // Modal title
                document.getElementById('modalTitle').textContent = t.modal.title;

                // Language toggle button (shows the language you switch TO)
                document.getElementById('langToggle').textContent = t.langToggleLabel;

                // Закрываем модалку, если открыта — чтобы не было рассинхрона
                if (modalOverlay && modalOverlay.classList.contains('active')) closeModal();
            }

            async function initLanguage() {
                let saved = null;
                try { saved = localStorage.getItem(LANG_STORAGE_KEY); } catch (e) {}

                if (saved === 'ru' || saved === 'en') {
                    applyLanguage(saved);
                    return;
                }

                // Первичное решение — по языку браузера
                const browserCIS = browserLangIsCIS();
                applyLanguage(browserCIS ? 'ru' : 'en');

                // Уточняем по IP (если IP из CIS — ставим русский)
                const country = await fetchCountry();
                if (country && CIS_COUNTRIES.indexOf(country) !== -1 && currentLang !== 'ru') {
                    applyLanguage('ru');
                }
            }

            /* ============================================================
               ЗВЁЗДЫ, ЧАСТИЦЫ
               ============================================================ */
            (function createStars() {
                const container = document.getElementById('stars');
                for (let i = 0; i < 80; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = (Math.random() * 3 + 1) + 'px';
                    star.style.height = star.style.width;
                    star.style.animationDelay = Math.random() * 5 + 's';
                    star.style.animationDuration = (Math.random() * 4 + 2) + 's';
                    container.appendChild(star);
                }
            })();

            (function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 55; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    const size = Math.random() * 9 + 3;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
                    particle.style.animationDelay = (Math.random() * 10) + 's';
                    particle.style.opacity = Math.random() * 0.5 + 0.2;
                    container.appendChild(particle);
                }
            })();

            /* ============================================================
               ОСНОВНЫЕ ДАННЫЕ (аватар, имя, соцсети)
               ============================================================ */
            document.getElementById('name').textContent = c.name;
            document.getElementById('title').textContent = '✦';

            const avatarEl = document.getElementById('avatar');
            avatarEl.src = c.avatar;
            avatarEl.alt = 'Avatar ' + c.name;

            const socialsContainer = document.getElementById('socials');
            socialsContainer.innerHTML = '';
            c.socials.forEach(s => {
                const a = document.createElement('a');
                a.className = 'social-link';
                if (s.name === 'Telegram') {
                    a.href = 'javascript:void(0)';
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        showModal();
                    });
                } else {
                    a.href = s.url;
                    a.target = '_blank';
                }
                a.innerHTML = `<span class="icon">${s.icon}</span> ${s.name}`;
                socialsContainer.appendChild(a);
            });

            /* ============================================================
               ABOUT MEDIA (создаётся один раз, не зависит от языка)
               ============================================================ */
            let aboutImgLoaded = false;
            (function renderAboutMedia() {
                const container = document.getElementById('aboutMediaContainer');
                container.innerHTML = '';
                if (c.aboutMedia && c.aboutMedia.trim() !== '') {
                    const url = c.aboutMedia.trim();
                    const ext = url.split('.').pop().toLowerCase();
                    const videoExts = ['mp4', 'webm', 'ogg', 'mov'];
                    let el;
                    if (videoExts.indexOf(ext) !== -1) {
                        el = document.createElement('video');
                        el.src = url;
                        el.controls = true;
                        el.loop = true;
                        el.muted = true;
                        el.className = 'about-media';
                        el.addEventListener('loadeddata', () => { aboutImgLoaded = true; checkAllLoaded(); });
                        el.addEventListener('error', () => { aboutImgLoaded = true; checkAllLoaded(); });
                    } else {
                        el = document.createElement('img');
                        el.src = url;
                        el.alt = 'Photo';
                        el.className = 'about-media';
                        el.addEventListener('load', () => { aboutImgLoaded = true; checkAllLoaded(); });
                        el.addEventListener('error', () => { aboutImgLoaded = true; checkAllLoaded(); });
                    }
                    container.appendChild(el);
                } else {
                    aboutImgLoaded = true;
                }
            })();

            /* ============================================================
               ПРОЕКТЫ (перерисовываются при смене языка)
               ============================================================ */
            function renderProjects(t) {
                const grid = document.getElementById('projectsGrid');
                grid.innerHTML = '';
                const projects = t.projects || [];
                if (projects.length > 0) {
                    projects.forEach((p, i) => {
                        const cProj = (c.projects || [])[i] || {};
                        const card = document.createElement('div');
                        card.className = 'project-card';
                        let imgHtml = '';
                        if (cProj.image && cProj.image.trim() !== '') {
                            imgHtml = `<img src="${cProj.image}" alt="${p.title}" />`;
                        }
                        card.innerHTML = `
                            ${imgHtml}
                            <h4>${p.title}</h4>
                            <div class="project-desc">${p.description || ''}</div>
                            ${cProj.link ? `<a href="${cProj.link}" target="_blank">${t.projectLink}</a>` : ''}
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = `<p style="color:#9bb7c9; text-align:center;">${t.noProjects}</p>`;
                }
            }

            /* ============================================================
               АЛЬБОМ — PINTEREST-СЕТКА + ЛЕНИВАЯ ПОДГРУЗКА + ЛАЙТБОКС
               ============================================================ */
            const albumGrid        = document.getElementById('albumGrid');
            const albumEmpty       = document.getElementById('albumEmpty');
            const albumLoaderEl    = document.getElementById('albumLoader');
            const albumSentinel    = document.getElementById('albumSentinel');
            const albumCountEl     = document.getElementById('albumCount');
            const albumSettingsBtn = document.getElementById('albumSettingsBtn');
            const albumSettingsPanel = document.getElementById('albumSettingsPanel');
            const albumSortSel     = document.getElementById('albumSort');
            const albumAutoplayCb  = document.getElementById('albumAutoplay');
            const albumMutedCb     = document.getElementById('albumMuted');
            const albumLoopCb      = document.getElementById('albumLoop');

            const ALBUM_SETTINGS_KEY = 'iemes32_album_settings';
            const ALBUM_BATCH = Math.max(3, parseInt(c.album.batchSize, 10) || 12);

            let albumEmptyState = null;

            const album = {
                all: [],
                items: [],
                els: [],
                rendered: 0,
                cols: [],
                colCount: 0,
                gapPx: parseInt(c.album.gap, 10) || 12,
                loading: false,
                ready: false,
                mounted: false,
                sentinelObserver: null,
                videoObserver: null,
                settings: {
                    sort: 'name-asc',
                    autoplay: false,
                    muted: true,
                    loop: true
                }
            };

            const sizeCache = new Map();

            function isAlbumTabActive() {
                const el = document.getElementById('tab-album');
                return !!el && el.classList.contains('active');
            }

            /* ---------- НАСТРОЙКИ ---------- */
            function loadAlbumSettings() {
                const defaults = Object.assign({ sort: 'name-asc', autoplay: false, muted: true, loop: true }, c.album.defaults || {});
                let saved = {};
                try { saved = JSON.parse(localStorage.getItem(ALBUM_SETTINGS_KEY) || '{}') || {}; } catch (e) {}
                album.settings.sort = ['name-asc', 'name-desc', 'none'].indexOf(saved.sort) !== -1 ? saved.sort : defaults.sort;
                album.settings.autoplay = typeof saved.autoplay === 'boolean' ? saved.autoplay : defaults.autoplay;
                album.settings.muted    = typeof saved.muted    === 'boolean' ? saved.muted    : defaults.muted;
                album.settings.loop     = typeof saved.loop     === 'boolean' ? saved.loop     : defaults.loop;
            }

            function saveAlbumSettings() {
                try { localStorage.setItem(ALBUM_SETTINGS_KEY, JSON.stringify(album.settings)); } catch (e) {}
            }

            function syncSettingsUI() {
                albumSortSel.value      = album.settings.sort;
                albumAutoplayCb.checked = album.settings.autoplay;
                albumMutedCb.checked    = album.settings.muted;
                albumLoopCb.checked     = album.settings.loop;
            }

            /* ---------- СОРТИРОВКА ---------- */
            function sortAlbumItems(list, mode) {
                const arr = list.slice();
                if (mode === 'name-asc') {
                    arr.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
                } else if (mode === 'name-desc') {
                    arr.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' }));
                }
                return arr;
            }

            /* ---------- EMPTY STATE ---------- */
            function setAlbumEmpty(state) {
                albumEmptyState = state;
                if (!state) { albumEmpty.style.display = 'none'; albumEmpty.innerHTML = ''; return; }
                const t = I18N[currentLang].album;
                albumEmpty.style.display = 'block';
                if (state === 'autoOff') albumEmpty.textContent = t.emptyAutoOff;
                else if (state === 'error') albumEmpty.textContent = t.emptyError;
                else if (state === 'empty') {
                    const prefix = c.album.filePrefix || '';
                    if (prefix) albumEmpty.innerHTML = t.emptyNoPrefix.replace('{prefix}', prefix);
                    else albumEmpty.textContent = t.emptyNoFiles;
                }
            }

            /* ---------- ЗАГРУЗКА СПИСКА ---------- */
            async function fetchAlbumItems() {
                if (!c.album.autoLoad) {
                    album.ready = true;
                    setAlbumEmpty('autoOff');
                    return;
                }

                const owner  = c.album.repoOwner;
                const repo   = c.album.repoName;
                const branch = c.album.branch || 'main';
                const cleanPath = (c.album.path || '').replace(/^\/+|\/+$/g, '');
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents${cleanPath ? '/' + cleanPath : ''}?ref=${encodeURIComponent(branch)}`;

                try {
                    const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
                    if (!res.ok) throw new Error('GitHub API: ' + res.status + ' ' + res.statusText);
                    const data = await res.json();
                    if (!Array.isArray(data)) throw new Error('Unexpected GitHub API response');

                    const prefix = (c.album.filePrefix || '').toLowerCase();
                    const found = [];

                    data.forEach(item => {
                        if (!item || item.type !== 'file' || !item.download_url) return;
                        const nameLower = item.name.toLowerCase();
                        if (prefix && nameLower.indexOf(prefix) !== 0) return;
                        const ext = nameLower.split('.').pop();
                        const isImage = c.album.imageExtensions.indexOf(ext) !== -1;
                        const isVideo = c.album.videoExtensions.indexOf(ext) !== -1;
                        if (!isImage && !isVideo) return;
                        found.push({
                            name: item.name,
                            url: item.download_url,
                            type: isVideo ? 'video' : 'image'
                        });
                    });

                    album.all = found;
                    album.ready = true;

                    if (!found.length) {
                        setAlbumEmpty('empty');
                        updateAlbumCount();
                        return;
                    }

                    album.items = sortAlbumItems(album.all, album.settings.sort);
                    updateAlbumCount();
                    setAlbumEmpty(null);

                    if (isAlbumTabActive()) mountAlbum();
                } catch (err) {
                    console.error('Album load error:', err);
                    album.ready = true;
                    setAlbumEmpty('error');
                }
            }

            function updateAlbumCount() {
                if (!albumCountEl) return;
                if (!album.items.length) { albumCountEl.textContent = ''; return; }
                const t = I18N[currentLang].album;
                albumCountEl.textContent = t.count
                    .replace('{shown}', Math.min(album.rendered, album.items.length))
                    .replace('{total}', album.items.length);
            }

            /* ---------- КОЛОНКИ ---------- */
            function calcColumnCount() {
                const w = albumGrid.clientWidth || 0;
                if (w < 360) return 1;
                if (w < 540) return 2;
                return 3;
            }

            function createColumnEls() {
                albumGrid.innerHTML = '';
                albumGrid.style.setProperty('--album-gap', album.gapPx + 'px');
                album.cols = [];
                album.colCount = calcColumnCount();
                for (let i = 0; i < album.colCount; i++) {
                    const col = document.createElement('div');
                    col.className = 'album-col';
                    albumGrid.appendChild(col);
                    album.cols.push(col);
                }
            }

            function appendToShortest(el) {
                let idx = 0;
                let minH = Infinity;
                for (let i = 0; i < album.cols.length; i++) {
                    const h = album.cols[i].offsetHeight;
                    if (h < minH) { minH = h; idx = i; }
                }
                album.cols[idx].appendChild(el);
            }

            /* ---------- РАЗМЕРЫ ---------- */
            function getMediaSize(item) {
                if (sizeCache.has(item.url)) return Promise.resolve(sizeCache.get(item.url));
                return new Promise(resolve => {
                    let done = false;
                    const finish = (w, h) => {
                        if (done) return;
                        done = true;
                        if (!w || !h) { w = 4; h = 3; }
                        const size = { w: w, h: h };
                        sizeCache.set(item.url, size);
                        resolve(size);
                    };
                    const timer = setTimeout(() => finish(4, 3), 10000);

                    if (item.type === 'video') {
                        const v = document.createElement('video');
                        v.preload = 'metadata';
                        v.muted = true;
                        v.playsInline = true;
                        v.onloadedmetadata = () => { clearTimeout(timer); finish(v.videoWidth, v.videoHeight); };
                        v.onerror = () => { clearTimeout(timer); finish(16, 9); };
                        v.src = item.url;
                    } else {
                        const img = new Image();
                        img.onload = () => { clearTimeout(timer); finish(img.naturalWidth, img.naturalHeight); };
                        img.onerror = () => { clearTimeout(timer); finish(4, 3); };
                        img.src = item.url;
                    }
                });
            }

            /* ============================================================
               КООРДИНАЦИЯ ВИДЕО ↔ МУЗЫКА
               Любое видео играет → музыка на паузу.
               Все видео остановлены → музыка возвращается.
               ============================================================ */
            const playingVideos = new Set();
            let musicPausedByVideo = false;

            function attachVideoMusicHandlers(video) {
                video.addEventListener('play', () => {
                    playingVideos.add(video);
                    updateMusicForVideos();
                });
                video.addEventListener('pause', () => {
                    playingVideos.delete(video);
                    updateMusicForVideos();
                });
                video.addEventListener('ended', () => {
                    playingVideos.delete(video);
                    updateMusicForVideos();
                });
            }

            function updateMusicForVideos() {
                const bgAudio = document.getElementById('bg-music');
                if (!bgAudio) return;
                if (playingVideos.size > 0) {
                    if (!bgAudio.paused) {
                        musicPausedByVideo = true;
                        bgAudio.pause();
                    }
                } else if (musicPausedByVideo) {
                    musicPausedByVideo = false;
                    bgAudio.play().catch(() => {});
                }
            }

            /* ---------- СОЗДАНИЕ КАРТОЧКИ ---------- */
            function createAlbumItem(item, size) {
                const wrap = document.createElement('div');
                wrap.className = 'album-item';
                wrap.style.aspectRatio = size.w + ' / ' + size.h;
                wrap.dataset.name = item.name;

                if (item.type === 'video') {
                    const video = document.createElement('video');
                    video.src = item.url;
                    video.controls = true;
                    video.loop = album.settings.loop;
                    video.muted = album.settings.muted;
                    video.playsInline = true;
                    video.setAttribute('playsinline', '');
                    video.preload = 'metadata';
                    wrap.appendChild(video);
                    attachVideoMusicHandlers(video);
                } else {
                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = item.name;
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.draggable = false;
                    wrap.appendChild(img);
                    // Клик по фото — открыть лайтбокс
                    wrap.addEventListener('click', (e) => {
                        e.preventDefault();
                        openLightbox(item.url);
                    });
                }
                return wrap;
            }

            /* ---------- МОНТИРОВАНИЕ ---------- */
            function mountAlbum() {
                if (album.mounted || !album.ready || !album.items.length) return;
                album.mounted = true;
                setAlbumEmpty(null);
                createColumnEls();
                setupSentinel();
                renderNextBatch();
            }

            function setupSentinel() {
                if (album.sentinelObserver) album.sentinelObserver.disconnect();
                albumSentinel.style.display = 'block';
                album.sentinelObserver = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) renderNextBatch();
                    });
                }, { root: null, rootMargin: '600px 0px', threshold: 0 });
                album.sentinelObserver.observe(albumSentinel);
            }

            /* ---------- ЛЕНИВАЯ ПОДГРУЗКА ---------- */
            async function renderNextBatch() {
                if (!album.mounted || album.loading) return;
                if (!isAlbumTabActive()) return;
                if (album.rendered >= album.items.length) {
                    updateAlbumCount();
                    albumSentinel.style.display = 'none';
                    return;
                }

                album.loading = true;
                if (albumLoaderEl) albumLoaderEl.style.display = 'block';

                const start = album.rendered;
                const batch = album.items.slice(start, start + ALBUM_BATCH);

                try {
                    const sizes = await Promise.all(batch.map(getMediaSize));
                    if (!album.mounted || !isAlbumTabActive()) return;

                    album.rendered = start + batch.length;
                    batch.forEach((item, i) => {
                        const el = createAlbumItem(item, sizes[i]);
                        appendToShortest(el);
                        album.els.push(el);
                    });

                    if (album.settings.autoplay) setupVideoObserver();
                } catch (e) {
                    console.warn('Batch render error:', e);
                } finally {
                    album.loading = false;
                    if (albumLoaderEl) albumLoaderEl.style.display = 'none';
                    updateAlbumCount();
                    if (album.rendered >= album.items.length) albumSentinel.style.display = 'none';
                    requestAnimationFrame(maybeLoadMore);
                }
            }

            function maybeLoadMore() {
                if (!album.mounted || album.loading) return;
                if (album.rendered >= album.items.length) return;
                if (!isAlbumTabActive()) return;
                const rect = albumSentinel.getBoundingClientRect();
                const vh = window.innerHeight || document.documentElement.clientHeight;
                if (rect.top <= vh + 500) renderNextBatch();
            }

            /* ---------- ВИДЕО-ОБЗЕРВЕР (для автоплея) ---------- */
            function setupVideoObserver() {
                if (album.videoObserver) {
                    album.videoObserver.disconnect();
                    album.videoObserver = null;
                }
                if (!album.settings.autoplay) return;

                const videos = albumGrid.querySelectorAll('video');
                if (!videos.length) return;

                album.videoObserver = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        const v = entry.target;
                        if (entry.isIntersecting) {
                            v.muted = album.settings.muted;
                            v.loop = album.settings.loop;
                            v.play().catch(() => {});
                        } else {
                            try { v.pause(); } catch (e) {}
                        }
                    });
                }, { threshold: 0.25 });

                videos.forEach(v => album.videoObserver.observe(v));
            }

            function applyVideoSettings() {
                albumGrid.querySelectorAll('video').forEach(v => {
                    v.muted = album.settings.muted;
                    v.loop = album.settings.loop;
                    if (!album.settings.autoplay) {
                        try { v.pause(); } catch (e) {}
                    }
                });
                setupVideoObserver();
            }

            /* ============================================================
               ЛАЙТБОКС
               ============================================================ */
            const lightboxEl    = document.getElementById('lightbox');
            const lightboxImg   = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev  = document.getElementById('lightboxPrev');
            const lightboxNext  = document.getElementById('lightboxNext');
            const lightboxCounter = document.getElementById('lightboxCounter');

            let lightboxIndex = -1;

            function getImageItems() {
                return album.items.filter(it => it.type === 'image');
            }

            function renderLightbox() {
                const imgs = getImageItems();
                if (!imgs.length || lightboxIndex < 0 || lightboxIndex >= imgs.length) return;
                const item = imgs[lightboxIndex];
                lightboxImg.src = item.url;
                lightboxImg.alt = item.name;
                lightboxCounter.textContent = (lightboxIndex + 1) + ' / ' + imgs.length;
                const many = imgs.length > 1;
                lightboxPrev.style.display = many ? 'flex' : 'none';
                lightboxNext.style.display = many ? 'flex' : 'none';
            }

            function openLightbox(url) {
                const imgs = getImageItems();
                const idx = imgs.findIndex(it => it.url === url);
                if (idx === -1) return;
                lightboxIndex = idx;
                renderLightbox();
                lightboxEl.classList.add('active');
                document.body.classList.add('lightbox-open');
            }

            function closeLightbox() {
                lightboxEl.classList.remove('active');
                document.body.classList.remove('lightbox-open');
                lightboxIndex = -1;
                lightboxImg.src = '';
            }

            function navigateLightbox(dir) {
                const imgs = getImageItems();
                if (!imgs.length) return;
                lightboxIndex = (lightboxIndex + dir + imgs.length) % imgs.length;
                renderLightbox();
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightboxPrev.addEventListener('click', () => navigateLightbox(-1));
            lightboxNext.addEventListener('click', () => navigateLightbox(1));
            lightboxEl.addEventListener('click', (e) => {
                if (e.target === lightboxEl) closeLightbox();
            });

            // Свайп
            let lbTouchX = 0;
            lightboxEl.addEventListener('touchstart', (e) => {
                lbTouchX = e.touches[0].clientX;
            }, { passive: true });
            lightboxEl.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - lbTouchX;
                if (Math.abs(dx) > 50) navigateLightbox(dx > 0 ? -1 : 1);
            }, { passive: true });

            /* ---------- ОБРАБОТЧИКИ НАСТРОЕК АЛЬБОМА ---------- */
            function applySettingsChange() {
                album.settings.sort     = albumSortSel.value;
                album.settings.autoplay = albumAutoplayCb.checked;
                album.settings.muted    = albumMutedCb.checked;
                album.settings.loop     = albumLoopCb.checked;
                saveAlbumSettings();
            }

            albumSortSel.addEventListener('change', () => {
                applySettingsChange();
                album.items = sortAlbumItems(album.all, album.settings.sort);
                closeLightbox();
                resetAlbumRender();
            });

            [albumAutoplayCb, albumMutedCb, albumLoopCb].forEach(cb => {
                cb.addEventListener('change', () => {
                    applySettingsChange();
                    applyVideoSettings();
                });
            });

            albumSettingsBtn.addEventListener('click', () => {
                const active = albumSettingsPanel.classList.toggle('active');
                albumSettingsBtn.classList.toggle('active', active);
            });

            function resetAlbumRender() {
                if (!album.mounted) return;
                album.els = [];
                album.rendered = 0;
                album.loading = false;
                updateAlbumCount();
                createColumnEls();
                albumSentinel.style.display = 'block';
                renderNextBatch();
            }

            /* ---------- АДАПТИВНАЯ ПЕРЕСБОРКА ---------- */
            let albumResizeTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(albumResizeTimer);
                albumResizeTimer = setTimeout(() => {
                    if (!album.mounted) return;
                    if (calcColumnCount() !== album.colCount) {
                        const els = album.els.slice();
                        createColumnEls();
                        els.forEach(el => appendToShortest(el));
                        if (album.settings.autoplay) setupVideoObserver();
                    }
                }, 200);
            });

            /* ---------- СТАРТ АЛЬБОМА ---------- */
            loadAlbumSettings();
            syncSettingsUI();
            fetchAlbumItems();

            /* ============================================================
               МУЗЫКА
               ============================================================ */
            const audio = document.getElementById('bg-music');
            let isMuted = false;
            let currentVolume = 0.35;

            let audioCtx = null;
            let analyser = null;
            let dataArray = null;
            let source = null;
            let isAudioReady = false;
            let audioLoaded = false;
            let audioBlobUrl = null;
            let musicLoaded = false;

            function setupAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    isAudioReady = true;
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            function loadMusic() {
                if (musicLoaded) return Promise.resolve();
                return fetch(c.music)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.blob();
                    })
                    .then(blob => {
                        audioBlobUrl = URL.createObjectURL(blob);
                        audio.src = audioBlobUrl;
                        audio.load();
                        setupAudio();
                        if (audioCtx) {
                            try {
                                source = audioCtx.createMediaElementSource(audio);
                                source.connect(analyser);
                                analyser.connect(audioCtx.destination);
                                isAudioReady = true;
                            } catch (e) {
                                console.warn('AnalyserNode connection failed');
                            }
                        }
                        audioLoaded = true;
                        musicLoaded = true;
                        return true;
                    });
            }

            function startMusic() {
                if (!audioLoaded) return;
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => { audio.play().catch(() => {}); }).catch(() => {});
                } else {
                    audio.play().catch(() => {});
                }
            }

            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeStatus = document.getElementById('volumeStatus');

            function updateMuteUI() {
                muteBtn.textContent = isMuted ? '🔇' : '🔊';
                audio.muted = isMuted;
                const vol = isMuted ? 0 : audio.volume;
                volumeStatus.textContent = Math.round(vol * 100) + '%';
                if (!isMuted) volumeSlider.value = vol;
            }

            muteBtn.addEventListener('click', function() {
                isMuted = !isMuted;
                if (isMuted) {
                    audio.muted = true;
                } else {
                    audio.muted = false;
                    audio.volume = currentVolume;
                    volumeSlider.value = currentVolume;
                }
                updateMuteUI();
            });

            volumeSlider.addEventListener('input', function() {
                let val = parseFloat(this.value);
                currentVolume = val;
                if (!isMuted) audio.volume = val;
                volumeStatus.textContent = Math.round(val * 100) + '%';
                if (isMuted && val > 0) {
                    isMuted = false;
                    audio.muted = false;
                    audio.volume = val;
                    updateMuteUI();
                } else if (val === 0) {
                    isMuted = true;
                    audio.muted = true;
                    updateMuteUI();
                }
            });
            volumeSlider.value = currentVolume;
            volumeStatus.textContent = '35%';

            /* ============================================================
               ВИЗУАЛИЗАТОР
               ============================================================ */
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight * 0.15;
                canvas.style.height = height + 'px';
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawVisualizer() {
                if (!isAudioReady || !analyser || !dataArray) {
                    ctx.clearRect(0, 0, width, height);
                    const barWidth = (width / 64) * 0.8;
                    const gap = (width / 64) * 0.2;
                    const now = Date.now() / 1000;
                    for (let i = 0; i < 64; i++) {
                        const barHeight = 10 + 30 * (0.5 + 0.5 * Math.sin(now * 2 + i * 0.3));
                        const x = i * (barWidth + gap) + gap / 2;
                        const gradient = ctx.createLinearGradient(x, height - barHeight, x, height);
                        gradient.addColorStop(0, '#2ba1cb');
                        gradient.addColorStop(1, '#5c6873');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                    }
                    requestAnimationFrame(drawVisualizer);
                    return;
                }

                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, width, height);

                const bufferLength = analyser.frequencyBinCount;
                const barWidth = (width / bufferLength) * 0.8;
                const gap = (width / bufferLength) * 0.2;
                let sum = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const value = dataArray[i];
                    sum += value;
                    const percent = value / 255;
                    const barHeight = percent * height * 0.9 + 4;
                    const x = i * (barWidth + gap) + gap / 2;
                    const gradient = ctx.createLinearGradient(x, height - barHeight, x, height);
                    gradient.addColorStop(0, `hsl(${190 + percent * 30}, 80%, 60%)`);
                    gradient.addColorStop(1, `hsl(${210 + percent * 20}, 70%, 40%)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                }

                const avg = sum / bufferLength / 255;
                document.querySelector('.card').style.animationDuration = (4 + (1 - avg) * 2) + 's';
                const particles = document.querySelectorAll('.particle');
                particles.forEach(p => {
                    const scale = 0.7 + avg * 0.8;
                    p.style.transform = `scale(${scale})`;
                    p.style.opacity = 0.4 + avg * 0.6;
                });

                requestAnimationFrame(drawVisualizer);
            }
            drawVisualizer();

            /* ============================================================
               МОДАЛЬНОЕ ОКНО
               ============================================================ */
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            const modalClose = document.getElementById('modalClose');

            async function getRealIP() {
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    return data.ip;
                } catch { return '?'; }
            }

            function getOS(ua) {
                if (ua.indexOf('Windows') !== -1) return 'Windows';
                if (ua.indexOf('Mac OS') !== -1) return 'macOS';
                if (ua.indexOf('Linux') !== -1) return 'Linux';
                if (ua.indexOf('Android') !== -1) return 'Android';
                if (ua.indexOf('iOS') !== -1) return 'iOS';
                return 'Unknown';
            }

            function getBrowser(ua) {
                if (ua.indexOf('Firefox') !== -1) return 'Firefox';
                if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) return 'Chrome';
                if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) return 'Safari';
                if (ua.indexOf('Edg') !== -1) return 'Edge';
                if (ua.indexOf('Opera') !== -1 || ua.indexOf('OPR') !== -1) return 'Opera';
                return 'Unknown';
            }

            function getBrowserVersion(ua) {
                const match = ua.match(/(Chrome|Firefox|Safari|Edg|OPR)\/(\d+\.\d+)/);
                return match ? match[2] : '?';
            }

            async function showModal() {
                const t = I18N[currentLang].modal;
                const ua = navigator.userAgent;
                const os = getOS(ua);
                const browser = getBrowser(ua);
                const browserVer = getBrowserVersion(ua);
                const ip = await getRealIP();
                const yes = t.yes, no = t.no, unknown = t.unknown;

                const data = {
                    [t.ip]: ip,
                    [t.browser]: `${browser} ${browserVer}`,
                    [t.os]: os,
                    [t.platform]: navigator.platform,
                    [t.language]: navigator.language,
                    [t.timezone]: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    [t.cookies]: navigator.cookieEnabled ? yes : no,
                    [t.online]: navigator.onLine ? yes : no,
                    [t.screenRes]: `${window.screen.width}×${window.screen.height}`,
                    [t.availArea]: `${window.screen.availWidth}×${window.screen.availHeight}`,
                    [t.colorDepth]: window.screen.colorDepth + ' ' + t.bit,
                    [t.deviceMemory]: navigator.deviceMemory ? navigator.deviceMemory + ' ' + t.gb : unknown,
                    [t.cpuCores]: navigator.hardwareConcurrency || unknown,
                    [t.network]: navigator.connection ? navigator.connection.effectiveType : unknown,
                    [t.userAgent]: ua,
                    [t.datetime]: new Date().toLocaleString(),
                    [t.favColor]: ['#2ba1cb', '#5c6873', '#002b44', '#ff6b6b', '#feca57'][Math.floor(Math.random() * 5)],
                    [t.speed]: (Math.random() * 100 + 20).toFixed(1) + ' ' + t.speedUnit
                };

                let html = '';
                for (let key in data) {
                    const value = data[key];
                    const cls = (key === t.ip || key === t.favColor) ? 'highlight' : '';
                    html += `<div class="data-item"><span class="label">${key}</span><span class="value ${cls}">${value}</span></div>`;
                }
                modalBody.innerHTML = html;
                document.getElementById('modalTitle').textContent = t.title;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

            /* ============================================================
               ЗАГРУЗЧИК
               ============================================================ */
            const loader = document.getElementById('loader');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const enterBtn = document.getElementById('enterBtn');
            const skipBtn = document.getElementById('skipBtn');

            let progress = 0;
            let loaderHidden = false;
            let allLoaded = false;

            function updateProgress(value) {
                const clamped = Math.min(100, Math.max(0, value));
                progressBar.style.width = clamped + '%';
                progressText.textContent = clamped + '%';
                if (clamped >= 100) enableEnterButton();
            }

            function enableEnterButton() {
                enterBtn.classList.add('active');
                skipBtn.classList.remove('active');
                skipBtn.style.display = 'none';
            }

            function checkAllLoaded() {
                if (allLoaded) return;
                const avatarImg = document.getElementById('avatar');
                let avatarLoaded = !!(avatarImg.complete && avatarImg.naturalWidth > 0);

                if (avatarLoaded && aboutImgLoaded && musicLoaded) {
                    allLoaded = true;
                    updateProgress(100);
                } else {
                    let loadedCount = 0;
                    const total = 3;
                    if (avatarLoaded) loadedCount++;
                    if (aboutImgLoaded) loadedCount++;
                    if (musicLoaded) loadedCount++;
                    updateProgress(Math.min(90, Math.floor((loadedCount / total) * 90)));
                }
            }

            const avatarImg = document.getElementById('avatar');
            avatarImg.addEventListener('load', checkAllLoaded);
            avatarImg.addEventListener('error', checkAllLoaded);

            loadMusic().then(checkAllLoaded).catch(() => { musicLoaded = true; checkAllLoaded(); });

            setTimeout(() => {
                if (!allLoaded) {
                    skipBtn.classList.add('active');
                    skipBtn.style.display = 'inline-block';
                }
            }, 10000);

            skipBtn.addEventListener('click', function() {
                if (loaderHidden) return;
                loaderHidden = true;
                loader.classList.add('hidden');
                if (!musicLoaded) loadMusic().then(startMusic);
                else startMusic();
                setTimeout(showCookieBanner, 3000);
                checkVPN();
            });

            function enterSite() {
                if (loaderHidden) return;
                loaderHidden = true;
                loader.classList.add('hidden');
                startMusic();
                setTimeout(showCookieBanner, 3000);
                checkVPN();
            }
            enterBtn.addEventListener('click', enterSite);

            /* ============================================================
               COOKIE / VPN
               ============================================================ */
            const cookieBanner = document.getElementById('cookieBanner');
            const cookieYes = document.getElementById('cookieYes');
            const cookieAbsolutely = document.getElementById('cookieAbsolutely');

            function showCookieBanner() {
                if (localStorage.getItem('cookieConsent') === 'true') return;
                cookieBanner.style.display = 'block';
            }

            function acceptCookies() {
                localStorage.setItem('cookieConsent', 'true');
                cookieBanner.style.display = 'none';
            }
            cookieYes.addEventListener('click', acceptCookies);
            cookieAbsolutely.addEventListener('click', acceptCookies);

            const vpnBanner = document.getElementById('vpnBanner');
            const vpnClose = document.getElementById('vpnClose');

            async function checkVPN() {
                if (localStorage.getItem('vpnClosed') === 'true') return;
                const country = await fetchCountry();
                if (country && country !== 'RU' && country !== 'BY') {
                    vpnBanner.style.display = 'block';
                }
            }

            vpnClose.addEventListener('click', function() {
                localStorage.setItem('vpnClosed', 'true');
                vpnBanner.style.display = 'none';
            });

            /* ============================================================
               ВКЛАДКИ
               ============================================================ */
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = {
                about: document.getElementById('tab-about'),
                projects: document.getElementById('tab-projects'),
                album: document.getElementById('tab-album')
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.dataset.tab;
                    tabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    this.classList.add('active');
                    if (tabContents[target]) tabContents[target].classList.add('active');

                    if (target === 'album') {
                        requestAnimationFrame(() => {
                            mountAlbum();
                            maybeLoadMore();
                        });
                    }
                });
            });

            /* ============================================================
               ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА + КЛАВИАТУРА
               ============================================================ */
            document.getElementById('langToggle').addEventListener('click', () => {
                applyLanguage(currentLang === 'ru' ? 'en' : 'ru');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (lightboxEl.classList.contains('active')) closeLightbox();
                    else if (modalOverlay.classList.contains('active')) closeModal();
                } else if (lightboxEl.classList.contains('active')) {
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    else if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });

            /* ============================================================
               ФОН
               ============================================================ */
            if (c.backgroundImage && c.backgroundImage.trim() !== '') {
                document.body.style.background = `url("${c.backgroundImage}") center/cover no-repeat fixed, #0e1419`;
            }

            /* ============================================================
               ИНИЦИАЛИЗАЦИЯ ЯЗЫКА (в конце — все элементы уже в DOM)
               ============================================================ */
            initLanguage();

        })();
    </script>
</body>
</html>
